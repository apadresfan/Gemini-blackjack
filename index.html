<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monster Math 21 - Mobile Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Short+Stack&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-red: #ff5252;
      --primary-yellow: #ffd740;
      --primary-blue: #40c4ff;
      --primary-green: #69f0ae;
      --primary-purple: #b388ff;
      --primary-orange: #ff9100;
      --paper-bg: #f7f9f2;
      --line-blue: rgba(187, 222, 251, 0.6);
      --margin-red: rgba(255, 138, 128, 0.5);
      --text-color: #2c3e50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Short Stack', 'Fredoka One', cursive, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--paper-bg);
      background-image: 
        linear-gradient(90deg, transparent 38px, var(--margin-red) 38px, var(--margin-red) 40px, transparent 40px),
        linear-gradient(var(--line-blue) 1px, transparent 1px);
      background-size: 100% 100%, 100% 22px;
      color: var(--text-color);
      user-select: none;
    }

    .app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.4rem 0.6rem;
      gap: 0.3rem;
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.95);
      border: 3px dashed var(--primary-purple);
      border-radius: 16px;
      padding: 0.3rem 0.6rem;
      gap: 0.3rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      flex-shrink: 0;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: var(--primary-red);
      text-shadow: 1.5px 1.5px 0px var(--primary-yellow);
      white-space: nowrap;
    }

    .voice-bar {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    select {
      background: #fff;
      border: 2px solid var(--primary-blue);
      color: var(--text-color);
      padding: 0.2rem 0.4rem;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: bold;
      outline: none;
      max-width: 110px;
    }

    .icon-btn {
      background: var(--primary-yellow);
      border: 2px solid var(--primary-orange);
      color: #333;
      padding: 0.25rem 0.5rem;
      border-radius: 10px;
      font-family: 'Fredoka One', cursive;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--primary-orange);
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .icon-btn:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .scoreboard {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid var(--primary-orange);
      border-radius: 14px;
      padding: 0.25rem 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.04);
      flex-shrink: 0;
    }

    .score-box {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-family: 'Fredoka One', cursive;
      font-size: 0.85rem;
    }

    .score-pill {
      background: #f0f0f0;
      padding: 0.1rem 0.5rem;
      border-radius: 8px;
      border: 1.5px solid #ccc;
      font-weight: bold;
    }

    .score-wins .score-pill {
      background: #e8f5e9;
      border-color: var(--primary-green);
      color: #2e7d32;
    }

    .score-losses .score-pill {
      background: #ffebee;
      border-color: var(--primary-red);
      color: #c62828;
    }

    .btn-reset-score {
      background: #eceff1;
      border: 1px dashed #90a4ae;
      color: #546e7a;
      padding: 0.15rem 0.4rem;
      border-radius: 8px;
      font-family: 'Fredoka One', cursive;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .play-area {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      padding: 0.5rem 0.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      min-height: 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .play-area.dealer {
      border: 3px solid var(--primary-blue);
    }

    .play-area.player {
      border: 3px solid var(--primary-green);
    }

    .area-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.2rem;
    }

    .monster-tag {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(0.85rem, 3.5vw, 1.05rem);
    }

    .monster-avatar {
      font-size: 1.4rem;
      line-height: 1;
    }

    .badge-score {
      background: var(--primary-yellow);
      border: 2px dashed var(--primary-orange);
      padding: 0.15rem 0.6rem;
      border-radius: 12px;
      font-family: 'Fredoka One', cursive;
      font-size: 0.85rem;
      color: #444;
    }

    .card-container {
      display: flex;
      gap: 0.4rem;
      flex-wrap: nowrap;
      overflow-x: auto;
      align-items: center;
      flex: 1;
      padding: 0.2rem 0;
    }

    .card {
      width: min(13vw, 55px);
      height: min(19vw, 82px);
      background: #ffffff;
      border: 2px solid #333;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.2rem 0.25rem;
      font-family: 'Fredoka One', cursive;
      box-shadow: 2px 3px 0px rgba(0,0,0,0.12);
      flex-shrink: 0;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .card.back {
      background: repeating-linear-gradient(
        45deg,
        var(--primary-purple),
        var(--primary-purple) 6px,
        var(--primary-blue) 6px,
        var(--primary-blue) 12px
      );
      color: white;
      justify-content: center;
      align-items: center;
      font-size: 1.4rem;
    }

    .card-corner {
      font-size: clamp(0.65rem, 2.5vw, 0.85rem);
      line-height: 1;
    }

    .card-center-icon {
      font-size: clamp(0.9rem, 4vw, 1.3rem);
      align-self: center;
      line-height: 1;
    }

    .speech-bubble {
      background: #fff;
      border: 3px solid var(--primary-red);
      border-radius: 14px;
      padding: 0.4rem 0.6rem;
      text-align: center;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(0.8rem, 3.2vw, 0.95rem);
      color: var(--primary-red);
      box-shadow: 0 3px 0 rgba(0,0,0,0.05);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
    }

    .controls {
      display: flex;
      gap: 0.4rem;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      padding-top: 0.1rem;
    }

    .btn-action {
      border: 2.5px solid #333;
      padding: 0.5rem 0.2rem;
      border-radius: 14px;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(0.8rem, 3.2vw, 0.95rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      flex: 1;
      transition: all 0.1s;
    }

    .btn-deal {
      background: var(--primary-yellow);
      color: #333;
      box-shadow: 0 4px 0 var(--primary-orange);
    }

    .btn-hit {
      background: var(--primary-green);
      color: #1b5e20;
      box-shadow: 0 4px 0 #388e3c;
    }

    .btn-stand {
      background: var(--primary-red);
      color: white;
      box-shadow: 0 4px 0 #d32f2f;
    }

    .btn-action:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: none;
    }

    .btn-action:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .mic-button {
      background: var(--primary-blue);
      border: 2.5px solid #0288d1;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #0277bd;
      flex-shrink: 0;
    }

    .mic-button.listening {
      background: var(--primary-red);
      border-color: #b71c1c;
      box-shadow: 0 0 0 5px rgba(255, 82, 82, 0.4);
      animation: pulseMic 1.2s infinite ease-in-out;
    }

    @keyframes pulseMic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>✏️ Math 21</h1>
      <div class="voice-bar">
        <select id="voice-select" title="Choose Voice" onchange="saveVoiceSelection()"></select>
        <button class="icon-btn" onclick="testVoice()">🔊</button>
        <button class="icon-btn" onclick="toggleMute()"><span id="mute-icon">🔊</span></button>
      </div>
    </header>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-box score-wins">
        <span>🏆 Wins:</span>
        <span class="score-pill" id="total-wins">0</span>
      </div>
      <div class="score-box score-losses">
        <span>👾 Losses:</span>
        <span class="score-pill" id="total-losses">0</span>
      </div>
      <button class="btn-reset-score" onclick="resetStats()" title="Reset scoreboard stats">🔄 Reset</button>
    </div>

    <!-- Dealer Play Area -->
    <div class="play-area dealer">
      <div class="area-header">
        <div class="monster-tag">
          <span class="monster-avatar">👾</span>
          <span>Barnaby</span>
        </div>
        <div class="badge-score" id="dealer-score">Score: ?</div>
      </div>
      <div class="card-container" id="dealer-cards"></div>
    </div>

    <!-- Speech bubble message display -->
    <div class="speech-bubble" id="status-text">Tap START to play! 🎲</div>

    <!-- Player Play Area -->
    <div class="play-area player">
      <div class="area-header">
        <div class="monster-tag">
          <span class="monster-avatar">🚀</span>
          <span>You</span>
        </div>
        <div class="badge-score" id="player-score">Score: 0</div>
      </div>
      <div class="card-container" id="player-cards"></div>
    </div>

    <!-- Action Buttons -->
    <div class="controls">
      <button class="btn-action btn-deal" id="btn-deal" onclick="startNewGame()">🎮 START</button>
      <button class="btn-action btn-hit" id="btn-hit" onclick="hit()" disabled>➕ CARD</button>
      <button class="btn-action btn-stand" id="btn-stand" onclick="stand()" disabled>✋ STAY</button>
      <button class="mic-button" id="mic-btn" onclick="toggleListening()" title="Voice Control Mic">🎙️</button>
    </div>
  </div>

  <script>
    const cardIcons = ['🎨', '✏️', '🍎', '⭐', '🚀', '⚽', '🎒'];
    let deck = [], playerHand = [], dealerHand = [];
    let gameActive = false;
    let voiceEnabled = true;
    let recognition = null;
    let isListening = false;
    let availableVoices = [];

    // Track total persistent stats via LocalStorage
    let totalWins = parseInt(localStorage.getItem('m21_total_wins') || '0', 10);
    let totalLosses = parseInt(localStorage.getItem('m21_total_losses') || '0', 10);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function updateScoreboardDisplay() {
      document.getElementById('total-wins').textContent = totalWins;
      document.getElementById('total-losses').textContent = totalLosses;
    }

    function recordWin() {
      totalWins++;
      localStorage.setItem('m21_total_wins', totalWins);
      updateScoreboardDisplay();
    }

    function recordLoss() {
      totalLosses++;
      localStorage.setItem('m21_total_losses', totalLosses);
      updateScoreboardDisplay();
    }

    function resetStats() {
      totalWins = 0;
      totalLosses = 0;
      localStorage.setItem('m21_total_wins', '0');
      localStorage.setItem('m21_total_losses', '0');
      updateScoreboardDisplay();
      speak("Scores reset!");
    }

    function playCardFlipSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playWinSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.1);
        osc.stop(audioCtx.currentTime + i * 0.1 + 0.25);
      });
    }

    function populateVoiceList() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
      const voiceSelect = document.getElementById('voice-select');
      const savedVoice = localStorage.getItem('m21_kids_voice');
      
      voiceSelect.innerHTML = '';

      const englishVoices = availableVoices
        .filter(v => v.lang.startsWith('en'))
        .sort((a, b) => {
          const aHigh = a.name.includes('Natural') || a.name.includes('Enhanced') || a.name.includes('Google') || a.name.includes('Siri');
          const bHigh = b.name.includes('Natural') || b.name.includes('Enhanced') || b.name.includes('Google') || b.name.includes('Siri');
          return (aHigh === bHigh) ? 0 : aHigh ? -1 : 1;
        });

      const listToUse = englishVoices.length > 0 ? englishVoices : availableVoices;

      listToUse.forEach((voice) => {
        const option = document.createElement('option');
        option.value = voice.name;
        option.textContent = voice.name.split(' ')[0];
        if (savedVoice && voice.name === savedVoice) {
          option.selected = true;
        }
        voiceSelect.appendChild(option);
      });
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = populateVoiceList;
      populateVoiceList();
    }

    function saveVoiceSelection() {
      const selected = document.getElementById('voice-select').value;
      localStorage.setItem('m21_kids_voice', selected);
    }

    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      const selectedVoiceName = document.getElementById('voice-select').value;
      const voice = availableVoices.find(v => v.name === selectedVoiceName);
      
      if (voice) utterance.voice = voice;
      utterance.pitch = 1.1;
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function testVoice() {
      speak("Hi math superstar!");
    }

    function buildDeck() {
      deck = [];
      for (let icon of cardIcons) {
        for (let v = 1; v <= 10; v++) {
          deck.push({ value: v, icon: icon, label: v === 1 ? 'A' : v });
        }
      }
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
    }

    function calculateScore(hand) {
      let sum = 0;
      let aces = 0;
      for (let card of hand) {
        if (card.value === 1) {
          aces++;
          sum += 11;
        } else {
          sum += card.value;
        }
      }
      while (sum > 21 && aces > 0) {
        sum -= 10;
        aces--;
      }
      return sum;
    }

    function renderCards() {
      const pContainer = document.getElementById('player-cards');
      const dContainer = document.getElementById('dealer-cards');

      pContainer.innerHTML = playerHand.map((c) => `
        <div class="card">
          <div class="card-corner">${c.label}</div>
          <div class="card-center-icon">${c.icon}</div>
          <div class="card-corner" style="align-self: flex-end;">${c.label}</div>
        </div>
      `).join('');

      dContainer.innerHTML = dealerHand.map((c, idx) => {
        if (idx === 1 && gameActive) {
          return `<div class="card back">❓</div>`;
        }
        return `
          <div class="card">
            <div class="card-corner">${c.label}</div>
            <div class="card-center-icon">${c.icon}</div>
            <div class="card-corner" style="align-self: flex-end;">${c.label}</div>
          </div>
        `;
      }).join('');

      document.getElementById('player-score').textContent = `Score: ${calculateScore(playerHand)}`;
      document.getElementById('dealer-score').textContent = gameActive ? `Score: ?` : `Score: ${calculateScore(dealerHand)}`;
    }

    function startNewGame() {
      buildDeck();
      playCardFlipSound();
      playerHand = [deck.pop(), deck.pop()];
      dealerHand = [deck.pop(), deck.pop()];
      gameActive = true;

      document.getElementById('btn-hit').disabled = false;
      document.getElementById('btn-stand').disabled = false;
      document.getElementById('btn-deal').disabled = true;

      renderCards();
      const score = calculateScore(playerHand);
      const msg = `Score is ${score}! Hit or Stay?`;
      document.getElementById('status-text').textContent = msg;
      speak(msg);
    }

    function hit() {
      if (!gameActive) return;
      playCardFlipSound();
      playerHand.push(deck.pop());
      renderCards();

      const score = calculateScore(playerHand);
      if (score > 21) {
        gameActive = false;
        recordLoss();
        const msg = `Bust with ${score}! Barnaby wins!`;
        document.getElementById('status-text').textContent = msg;
        speak(msg);
        endGame();
      } else if (score === 21) {
        speak(`Perfect 21!`);
        stand();
      } else {
        const msg = `Score is ${score}! Hit or Stay?`;
        document.getElementById('status-text').textContent = msg;
        speak(msg);
      }
    }

    function stand() {
      if (!gameActive) return;
      gameActive = false;

      while (calculateScore(dealerHand) < 17) {
        dealerHand.push(deck.pop());
      }

      playCardFlipSound();
      renderCards();

      const pScore = calculateScore(playerHand);
      const dScore = calculateScore(dealerHand);

      let winnerMsg = "";
      if (dScore > 21 || pScore > dScore) {
        winnerMsg = `Awesome! You win with ${pScore}! 🌟`;
        recordWin();
        playWinSound();
      } else if (pScore === dScore) {
        winnerMsg = `Tie game at ${pScore}!`;
      } else {
        winnerMsg = `Barnaby wins with ${dScore}!`;
        recordLoss();
      }

      document.getElementById('status-text').textContent = winnerMsg;
      speak(winnerMsg);
      endGame();
    }

    function endGame() {
      document.getElementById('btn-hit').disabled = true;
      document.getElementById('btn-stand').disabled = true;
      document.getElementById('btn-deal').disabled = false;
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        const cmd = event.results[0][0].transcript.toLowerCase();
        if (cmd.includes('hit') || cmd.includes('card') || cmd.includes('more')) {
          hit();
        } else if (cmd.includes('stay') || cmd.includes('stand') || cmd.includes('stop')) {
          stand();
        } else if (cmd.includes('start') || cmd.includes('deal') || cmd.includes('play')) {
          startNewGame();
        }
        toggleListening(false);
      };

      recognition.onerror = () => toggleListening(false);
      recognition.onend = () => toggleListening(false);
    }

    function toggleListening(forceState) {
      if (!recognition) return;
      isListening = forceState !== undefined ? forceState : !isListening;
      const btn = document.getElementById('mic-btn');
      if (isListening) {
        btn.classList.add('listening');
        recognition.start();
      } else {
        btn.classList.remove('listening');
        try { recognition.stop(); } catch(e){}
      }
    }

    function toggleMute() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('mute-icon').textContent = voiceEnabled ? '🔊' : '🔇';
    }

    window.onload = function() {
      updateScoreboardDisplay();
    };
  </script>
</body>
</html>
