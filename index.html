<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster Math 21 - Kids Voice Card Game</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      user-select: none;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.25rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--accent);
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-btns {
      display: flex;
      gap: 0.5rem;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 0.75rem;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .game-board {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      flex: 1;
    }

    .play-area {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 1.5rem;
      padding: 1.25rem;
      border: 2px dashed rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .area-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .avatar-tag {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.3rem;
      font-weight: bold;
    }

    .score-badge {
      background: rgba(0, 0, 0, 0.4);
      padding: 0.4rem 0.8rem;
      border-radius: 1rem;
      font-size: 1.1rem;
      color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .card-container {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      min-height: 125px;
      align-items: center;
    }

    .card {
      width: 85px;
      height: 120px;
      background: white;
      color: #1e293b;
      border-radius: 0.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.5rem;
      font-weight: bold;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    @keyframes popIn {
      0% { transform: scale(0) rotate(-10deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .card.back {
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      color: white;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
    }

    .card-val {
      font-size: 1.4rem;
      line-height: 1;
    }

    .card-suit {
      font-size: 1.8rem;
      align-self: center;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .btn-hit { background: var(--success); font-size: 1.2rem; padding: 0.8rem 1.5rem; }
    .btn-hit:hover { background: #059669; }

    .btn-stand { background: var(--danger); font-size: 1.2rem; padding: 0.8rem 1.5rem; }
    .btn-stand:hover { background: #dc2626; }

    .btn-deal { background: var(--accent); color: #0f172a; font-size: 1.3rem; padding: 0.8rem 2rem; }
    .btn-deal:hover { background: #d97706; }

    .mic-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .mic-btn.listening {
      background: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .status-msg {
      text-align: center;
      font-size: 1.35rem;
      min-height: 2.5rem;
      color: var(--accent);
      font-weight: bold;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #1e293b;
      border-radius: 1.5rem;
      padding: 2rem;
      width: 90%;
      max-width: 500px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label { font-size: 0.95rem; color: var(--text-dim); }

    select {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.7rem;
      border-radius: 0.5rem;
      font-size: 1rem;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>👾 Monster Math 21</h1>
    <div class="header-btns">
      <button onclick="toggleVoice()"><span id="voice-icon">🔊</span> Voice On</button>
      <button onclick="openSettings()">🎙️ Voice Selection</button>
    </div>
  </header>

  <div class="game-board">
    <!-- Dealer Area -->
    <div class="play-area">
      <div class="area-header">
        <div class="avatar-tag">🐻 Barnaby Bear</div>
        <div class="score-badge" id="dealer-score">Score: ?</div>
      </div>
      <div class="card-container" id="dealer-cards"></div>
    </div>

    <div class="status-msg" id="status-text">Press DEAL to play!</div>

    <!-- Player Area -->
    <div class="play-area">
      <div class="area-header">
        <div class="avatar-tag">⭐ You</div>
        <div class="score-badge" id="player-score">Score: 0</div>
      </div>
      <div class="card-container" id="player-cards"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn-deal" id="btn-deal" onclick="startNewGame()">🎮 DEAL</button>
      <button class="btn-hit" id="btn-hit" onclick="hit()" disabled>➕ ANOTHER CARD</button>
      <button class="btn-stand" id="btn-stand" onclick="stand()" disabled>✋ STAY</button>
      <button class="mic-btn" id="mic-btn" onclick="toggleListening()" title="Speak Command">🎙️</button>
    </div>
  </div>

  <!-- Voice Settings Modal -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h2>🎙️ Choose Dealer Voice</h2>
      <p style="font-size:0.9rem; color: var(--text-dim);">Select from your device's realistic neural voices for free:</p>

      <div class="form-group">
        <label>Installed Realistic Voice</label>
        <select id="voice-select"></select>
      </div>

      <button onclick="testVoice()">🔊 Test Selected Voice</button>
      <button onclick="closeSettings()" style="background: var(--accent); color: #0f172a;">Save & Play</button>
    </div>
  </div>

  <script>
    const suits = ['🍎', '⭐', '🎈', '🐶'];
    let deck = [], playerHand = [], dealerHand = [];
    let gameActive = false;
    let voiceEnabled = true;
    let recognition = null;
    let isListening = false;
    let availableVoices = [];

    // Synthesize Card & Fanfare Sound Effects via Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playCardSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playWinSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.25);
      });
    }

    // Populate Device Realistic Natural Voices
    function loadVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
        const voiceSelect = document.getElementById('voice-select');
        voiceSelect.innerHTML = '';
        
        // Filter and prioritize high-quality/natural voices
        const sortedVoices = availableVoices.sort((a, b) => {
          if (a.name.includes('Natural') || a.name.includes('Enhanced') || a.name.includes('Google') || a.name.includes('Siri')) return -1;
          return 1;
        });

        sortedVoices.forEach((voice, index) => {
          if (voice.lang.startsWith('en')) {
            const opt = document.createElement('option');
            opt.value = voice.name;
            opt.textContent = `${voice.name} (${voice.lang})`;
            voiceSelect.appendChild(opt);
          }
        });
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function buildDeck() {
      deck = [];
      for (let s of suits) {
        for (let v = 1; v <= 10; v++) {
          deck.push({ value: v, suit: s, label: v === 1 ? 'A' : v });
        }
      }
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
    }

    function calculateScore(hand) {
      let sum = 0;
      let aces = 0;
      for (let card of hand) {
        if (card.value === 1) {
          aces++;
          sum += 11;
        } else {
          sum += card.value;
        }
      }
      while (sum > 21 && aces > 0) {
        sum -= 10;
        aces--;
      }
      return sum;
    }

    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      const selectedVoiceName = document.getElementById('voice-select').value;
      const voice = availableVoices.find(v => v.name === selectedVoiceName);
      
      if (voice) {
        utterance.voice = voice;
      }
      utterance.pitch = 1.0;
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    function renderCards() {
      const pContainer = document.getElementById('player-cards');
      const dContainer = document.getElementById('dealer-cards');

      pContainer.innerHTML = playerHand.map(c => `
        <div class="card">
          <div class="card-val">${c.label}</div>
          <div class="card-suit">${c.suit}</div>
          <div class="card-val" style="align-self: flex-end;">${c.label}</div>
        </div>
      `).join('');

      dContainer.innerHTML = dealerHand.map((c, idx) => {
        if (idx === 1 && gameActive) {
          return `<div class="card back">❓</div>`;
        }
        return `
          <div class="card">
            <div class="card-val">${c.label}</div>
            <div class="card-suit">${c.suit}</div>
            <div class="card-val" style="align-self: flex-end;">${c.label}</div>
          </div>
        `;
      }).join('');

      const pScore = calculateScore(playerHand);
      document.getElementById('player-score').textContent = `Score: ${pScore}`;

      if (gameActive) {
        document.getElementById('dealer-score').textContent = `Score: ?`;
      } else {
        document.getElementById('dealer-score').textContent = `Score: ${calculateScore(dealerHand)}`;
      }
    }

    function startNewGame() {
      buildDeck();
      playCardSound();
      playerHand = [deck.pop(), deck.pop()];
      dealerHand = [deck.pop(), deck.pop()];
      gameActive = true;

      document.getElementById('btn-hit').disabled = false;
      document.getElementById('btn-stand').disabled = false;
      document.getElementById('btn-deal').disabled = true;

      renderCards();
      const score = calculateScore(playerHand);
      const msg = `You have ${score}! Do you want another card or stay?`;
      document.getElementById('status-text').textContent = msg;
      speak(msg);
    }

    function hit() {
      if (!gameActive) return;
      playCardSound();
      playerHand.push(deck.pop());
      renderCards();

      const score = calculateScore(playerHand);
      if (score > 21) {
        gameActive = false;
        document.getElementById('status-text').textContent = `Oh no, you went over 21! Barnaby wins!`;
        speak(`Oh no! You have ${score}. That's over 21!`);
        endGame();
      } else if (score === 21) {
        speak(`Awesome! You hit 21!`);
        stand();
      } else {
        const msg = `You have ${score}! Another card?`;
        document.getElementById('status-text').textContent = msg;
        speak(msg);
      }
    }

    function stand() {
      if (!gameActive) return;
      gameActive = false;

      while (calculateScore(dealerHand) < 17) {
        dealerHand.push(deck.pop());
      }

      playCardSound();
      renderCards();

      const pScore = calculateScore(playerHand);
      const dScore = calculateScore(dealerHand);

      let winnerMsg = "";
      if (dScore > 21 || pScore > dScore) {
        winnerMsg = `Yay! You win with ${pScore}! 🎉`;
        playWinSound();
      } else if (pScore === dScore) {
        winnerMsg = `It's a tie! Both have ${pScore}!`;
      } else {
        winnerMsg = `Barnaby Bear wins with ${dScore}! Good try!`;
      }

      document.getElementById('status-text').textContent = winnerMsg;
      speak(winnerMsg);
      endGame();
    }

    function endGame() {
      document.getElementById('btn-hit').disabled = true;
      document.getElementById('btn-stand').disabled = true;
      document.getElementById('btn-deal').disabled = false;
    }

    // Hands-Free Speech Control
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        const cmd = event.results[0][0].transcript.toLowerCase();
        if (cmd.includes('hit') || cmd.includes('card') || cmd.includes('more')) {
          hit();
        } else if (cmd.includes('stay') || cmd.includes('stand') || cmd.includes('stop')) {
          stand();
        } else if (cmd.includes('deal') || cmd.includes('start') || cmd.includes('play')) {
          startNewGame();
        }
        toggleListening(false);
      };

      recognition.onerror = () => toggleListening(false);
      recognition.onend = () => toggleListening(false);
    }

    function toggleListening(forceState) {
      if (!recognition) {
        alert("Speech recognition is not supported on this browser.");
        return;
      }
      isListening = forceState !== undefined ? forceState : !isListening;
      const btn = document.getElementById('mic-btn');
      if (isListening) {
        btn.classList.add('listening');
        recognition.start();
      } else {
        btn.classList.remove('listening');
        try { recognition.stop(); } catch(e){}
      }
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('voice-icon').textContent = voiceEnabled ? '🔊' : '🔇';
    }

    function openSettings() {
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    function testVoice() {
      speak("Hello! I am Barnaby Bear! Let's play Monster Math 21 together!");
    }
  </script>
</body>
</html>
