<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster Math 21 - Elementary School Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Short+Stack&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-red: #ff5252;
      --primary-yellow: #ffd740;
      --primary-blue: #40c4ff;
      --primary-green: #69f0ae;
      --primary-purple: #b388ff;
      --primary-orange: #ff9100;
      --paper-bg: #f7f9f2;
      --line-blue: rgba(187, 222, 251, 0.7);
      --margin-red: rgba(255, 138, 128, 0.6);
      --text-color: #2c3e50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Short Stack', 'Fredoka One', cursive, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--paper-bg);
      /* School notebook paper effect */
      background-image: 
        linear-gradient(90deg, transparent 69px, var(--margin-red) 69px, var(--margin-red) 72px, transparent 72px),
        linear-gradient(var(--line-blue) 1px, transparent 1px);
      background-size: 100% 100%, 100% 32px;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      user-select: none;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.9);
      border: 4px dashed var(--primary-purple);
      border-radius: 25px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.08);
      margin-bottom: 1rem;
      transform: rotate(-1deg);
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      color: var(--primary-red);
      text-shadow: 3px 3px 0px var(--primary-yellow);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: 1px;
    }

    .voice-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    select {
      background: #fff;
      border: 3px solid var(--primary-blue);
      color: var(--text-color);
      padding: 0.5rem 0.8rem;
      border-radius: 15px;
      font-size: 1rem;
      font-weight: bold;
      outline: none;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--primary-blue);
      transition: all 0.1s;
    }

    select:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--primary-blue);
    }

    .icon-btn {
      background: var(--primary-yellow);
      border: 3px solid var(--primary-orange);
      color: #333;
      padding: 0.5rem 0.9rem;
      border-radius: 15px;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--primary-orange);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      transform: scale(1.05) rotate(2deg);
    }

    .icon-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--primary-orange);
    }

    /* Scoreboard tracker styling */
    .scoreboard {
      width: 100%;
      max-width: 850px;
      background: rgba(255, 255, 255, 0.95);
      border: 4px solid var(--primary-orange);
      border-radius: 20px;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.06);
      margin-bottom: 1.2rem;
      transform: rotate(0.5deg);
    }

    .score-box {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
    }

    .score-pill {
      background: #f0f0f0;
      padding: 0.3rem 0.8rem;
      border-radius: 12px;
      border: 2px solid #ccc;
      color: #333;
    }

    .score-wins .score-pill {
      background: #e8f5e9;
      border-color: var(--primary-green);
      color: #2e7d32;
    }

    .score-losses .score-pill {
      background: #ffebee;
      border-color: var(--primary-red);
      color: #c62828;
    }

    .btn-reset-score {
      background: #eceff1;
      border: 2px dashed #90a4ae;
      color: #546e7a;
      padding: 0.3rem 0.8rem;
      border-radius: 12px;
      font-family: 'Fredoka One', cursive;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-reset-score:hover {
      background: #cfd8dc;
      color: #37474f;
    }

    .game-board {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .play-area {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 25px;
      padding: 1.2rem;
      position: relative;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }

    .play-area.dealer {
      border: 4px solid var(--primary-blue);
      transform: rotate(0.5deg);
    }

    .play-area.player {
      border: 4px solid var(--primary-green);
      transform: rotate(-0.5deg);
    }

    .area-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .monster-tag {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
    }

    .monster-avatar {
      font-size: 2.2rem;
      filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.1));
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .badge-score {
      background: var(--primary-yellow);
      border: 3px dashed var(--primary-orange);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      color: #444;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
    }

    .card-container {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      min-height: 135px;
      align-items: center;
      padding: 0.5rem;
    }

    .card {
      width: 90px;
      height: 130px;
      background: #ffffff;
      border: 3px solid #333;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.5rem;
      font-family: 'Fredoka One', cursive;
      box-shadow: 4px 6px 0px rgba(0,0,0,0.15);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      transform: rotate(calc(-3deg + 6deg * var(--rand, 0.5)));
    }

    @keyframes popIn {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .card.back {
      background: repeating-linear-gradient(
        45deg,
        var(--primary-purple),
        var(--primary-purple) 10px,
        var(--primary-blue) 10px,
        var(--primary-blue) 20px
      );
      color: white;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      border: 3px solid #333;
    }

    .card-corner {
      font-size: 1.3rem;
      line-height: 1;
    }

    .card-center-icon {
      font-size: 2rem;
      align-self: center;
    }

    .speech-bubble {
      background: #fff;
      border: 4px solid var(--primary-red);
      border-radius: 20px;
      padding: 1rem;
      text-align: center;
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      color: var(--primary-red);
      position: relative;
      box-shadow: 0 6px 0 rgba(0,0,0,0.06);
      margin: 0.2rem 0;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -15px;
      left: 10%;
      border-width: 0 15px 15px;
      border-style: solid;
      border-color: var(--primary-red) transparent;
      display: block;
      width: 0;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .btn-action {
      border: 3px solid #333;
      padding: 0.8rem 1.6rem;
      border-radius: 20px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.15s;
    }

    .btn-deal {
      background: var(--primary-yellow);
      color: #333;
      box-shadow: 0 6px 0 var(--primary-orange);
    }

    .btn-hit {
      background: var(--primary-green);
      color: #1b5e20;
      box-shadow: 0 6px 0 #388e3c;
    }

    .btn-stand {
      background: var(--primary-red);
      color: white;
      box-shadow: 0 6px 0 #d32f2f;
    }

    .btn-action:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.03);
    }

    .btn-action:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }

    .btn-action:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .mic-button {
      background: var(--primary-blue);
      border: 3px solid #0288d1;
      border-radius: 50%;
      width: 65px;
      height: 65px;
      font-size: 1.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 6px 0 #0277bd;
      transition: all 0.2s;
    }

    .mic-button.listening {
      background: var(--primary-red);
      border-color: #b71c1c;
      box-shadow: 0 0 0 8px rgba(255, 82, 82, 0.4);
      animation: pulseMic 1.2s infinite ease-in-out;
    }

    @keyframes pulseMic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <header>
    <h1>✏️ Monster Math 21</h1>
    <div class="voice-bar">
      <select id="voice-select" title="Choose Native Voice" onchange="saveVoiceSelection()"></select>
      <button class="icon-btn" onclick="testVoice()">🔊 Test Voice</button>
      <button class="icon-btn" onclick="toggleMute()"><span id="mute-icon">🔊</span></button>
    </div>
  </header>

  <!-- Persistent Scoreboard View -->
  <div class="scoreboard">
    <div class="score-box score-wins">
      <span>🏆 Wins:</span>
      <span class="score-pill" id="total-wins">0</span>
    </div>
    <div class="score-box score-losses">
      <span>👾 Losses:</span>
      <span class="score-pill" id="total-losses">0</span>
    </div>
    <button class="btn-reset-score" onclick="resetStats()" title="Reset scoreboard stats">🔄 Reset Score</button>
  </div>

  <div class="game-board">
    <div class="play-area dealer">
      <div class="area-header">
        <div class="monster-tag">
          <span class="monster-avatar">👾</span>
          <span>Barnaby Math Monster</span>
        </div>
        <div class="badge-score" id="dealer-score">Score: ?</div>
      </div>
      <div class="card-container" id="dealer-cards"></div>
    </div>

    <!-- Speech bubble message display -->
    <div class="speech-bubble" id="status-text">Click START to deal the cards! 🎲</div>

    <div class="play-area player">
      <div class="area-header">
        <div class="monster-tag">
          <span class="monster-avatar">🚀</span>
          <span>You (Math Champ)</span>
        </div>
        <div class="badge-score" id="player-score">Score: 0</div>
      </div>
      <div class="card-container" id="player-cards"></div>
    </div>

    <div class="controls">
      <button class="btn-action btn-deal" id="btn-deal" onclick="startNewGame()">🎮 START</button>
      <button class="btn-action btn-hit" id="btn-hit" onclick="hit()" disabled>➕ CARD</button>
      <button class="btn-action btn-stand" id="btn-stand" onclick="stand()" disabled>✋ STAY</button>
      <button class="mic-button" id="mic-btn" onclick="toggleListening()" title="Voice Command Mic">🎙️</button>
    </div>
  </div>

  <script>
    const cardIcons = ['🎨', '✏️', '🍎', '⭐', '🚀', '⚽', '🎒'];
    let deck = [], playerHand = [], dealerHand = [];
    let gameActive = false;
    let voiceEnabled = true;
    let recognition = null;
    let isListening = false;
    let availableVoices = [];

    // Track total persistent stats
    let totalWins = parseInt(localStorage.getItem('m21_total_wins') || '0', 10);
    let totalLosses = parseInt(localStorage.getItem('m21_total_losses') || '0', 10);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function updateScoreboardDisplay() {
      document.getElementById('total-wins').textContent = totalWins;
      document.getElementById('total-losses').textContent = totalLosses;
    }

    function recordWin() {
      totalWins++;
      localStorage.setItem('m21_total_wins', totalWins);
      updateScoreboardDisplay();
    }

    function recordLoss() {
      totalLosses++;
      localStorage.setItem('m21_total_losses', totalLosses);
      updateScoreboardDisplay();
    }

    function resetStats() {
      totalWins = 0;
      totalLosses = 0;
      localStorage.setItem('m21_total_wins', '0');
      localStorage.setItem('m21_total_losses', '0');
      updateScoreboardDisplay();
      speak("Scores reset to zero!");
    }

    function playCardFlipSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playWinSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.12);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.12 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.12);
        osc.stop(audioCtx.currentTime + i * 0.12 + 0.3);
      });
    }

    function populateVoiceList() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
      const voiceSelect = document.getElementById('voice-select');
      const savedVoice = localStorage.getItem('m21_kids_voice');
      
      voiceSelect.innerHTML = '';

      const englishVoices = availableVoices
        .filter(v => v.lang.startsWith('en'))
        .sort((a, b) => {
          const aHigh = a.name.includes('Natural') || a.name.includes('Enhanced') || a.name.includes('Google') || a.name.includes('Siri');
          const bHigh = b.name.includes('Natural') || b.name.includes('Enhanced') || b.name.includes('Google') || b.name.includes('Siri');
          return (aHigh === bHigh) ? 0 : aHigh ? -1 : 1;
        });

      const listToUse = englishVoices.length > 0 ? englishVoices : availableVoices;

      listToUse.forEach((voice) => {
        const option = document.createElement('option');
        option.value = voice.name;
        option.textContent = `🎙️ ${voice.name} (${voice.lang.split('-')[0].toUpperCase()})`;
        if (savedVoice && voice.name === savedVoice) {
          option.selected = true;
        }
        voiceSelect.appendChild(option);
      });
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = populateVoiceList;
      populateVoiceList();
    }

    function saveVoiceSelection() {
      const selected = document.getElementById('voice-select').value;
      localStorage.setItem('m21_kids_voice', selected);
    }

    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      const selectedVoiceName = document.getElementById('voice-select').value;
      const voice = availableVoices.find(v => v.name === selectedVoiceName);
      
      if (voice) utterance.voice = voice;
      utterance.pitch = 1.1; // Expressive pitch for kids
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    function testVoice() {
      speak("Hi math superstar! Let's reach 21 together!");
    }

    function buildDeck() {
      deck = [];
      for (let icon of cardIcons) {
        for (let v = 1; v <= 10; v++) {
          deck.push({ value: v, icon: icon, label: v === 1 ? 'A' : v });
        }
      }
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
    }

    function calculateScore(hand) {
      let sum = 0;
      let aces = 0;
      for (let card of hand) {
        if (card.value === 1) {
          aces++;
          sum += 11;
        } else {
          sum += card.value;
        }
      }
      while (sum > 21 && aces > 0) {
        sum -= 10;
        aces--;
      }
      return sum;
    }

    function renderCards() {
      const pContainer = document.getElementById('player-cards');
      const dContainer = document.getElementById('dealer-cards');

      pContainer.innerHTML = playerHand.map((c, idx) => `
        <div class="card" style="--rand: ${(idx % 3) * 0.4};">
          <div class="card-corner">${c.label}</div>
          <div class="card-center-icon">${c.icon}</div>
          <div class="card-corner" style="align-self: flex-end;">${c.label}</div>
        </div>
      `).join('');

      dContainer.innerHTML = dealerHand.map((c, idx) => {
        if (idx === 1 && gameActive) {
          return `<div class="card back">❓</div>`;
        }
        return `
          <div class="card" style="--rand: ${(idx % 2) * 0.5};">
            <div class="card-corner">${c.label}</div>
            <div class="card-center-icon">${c.icon}</div>
            <div class="card-corner" style="align-self: flex-end;">${c.label}</div>
          </div>
        `;
      }).join('');

      document.getElementById('player-score').textContent = `Score: ${calculateScore(playerHand)}`;
      document.getElementById('dealer-score').textContent = gameActive ? `Score: ?` : `Score: ${calculateScore(dealerHand)}`;
    }

    function startNewGame() {
      buildDeck();
      playCardFlipSound();
      playerHand = [deck.pop(), deck.pop()];
      dealerHand = [deck.pop(), deck.pop()];
      gameActive = true;

      document.getElementById('btn-hit').disabled = false;
      document.getElementById('btn-stand').disabled = false;
      document.getElementById('btn-deal').disabled = true;

      renderCards();
      const score = calculateScore(playerHand);
      const msg = `Your score is ${score}! Do you want another card or stay?`;
      document.getElementById('status-text').textContent = msg;
      speak(msg);
    }

    function hit() {
      if (!gameActive) return;
      playCardFlipSound();
      playerHand.push(deck.pop());
      renderCards();

      const score = calculateScore(playerHand);
      if (score > 21) {
        gameActive = false;
        recordLoss();
        const msg = `Oh no! Score is ${score}. That's over 21! Monster Barnaby wins!`;
        document.getElementById('status-text').textContent = msg;
        speak(msg);
        endGame();
      } else if (score === 21) {
        speak(`Hooray! Perfect 21!`);
        stand();
      } else {
        const msg = `Score is ${score}! Want another card?`;
        document.getElementById('status-text').textContent = msg;
        speak(msg);
      }
    }

    function stand() {
      if (!gameActive) return;
      gameActive = false;

      while (calculateScore(dealerHand) < 17) {
        dealerHand.push(deck.pop());
      }

      playCardFlipSound();
      renderCards();

      const pScore = calculateScore(playerHand);
      const dScore = calculateScore(dealerHand);

      let winnerMsg = "";
      if (dScore > 21 || pScore > dScore) {
        winnerMsg = `Awesome math! You win with ${pScore}! 🌟`;
        recordWin();
        playWinSound();
      } else if (pScore === dScore) {
        winnerMsg = `Tie game! Both have ${pScore}!`;
      } else {
        winnerMsg = `Barnaby wins with ${dScore}! Great try!`;
        recordLoss();
      }

      document.getElementById('status-text').textContent = winnerMsg;
      speak(winnerMsg);
      endGame();
    }

    function endGame() {
      document.getElementById('btn-hit').disabled = true;
      document.getElementById('btn-stand').disabled = true;
      document.getElementById('btn-deal').disabled = false;
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        const cmd = event.results[0][0].transcript.toLowerCase();
        if (cmd.includes('hit') || cmd.includes('card') || cmd.includes('more')) {
          hit();
        } else if (cmd.includes('stay') || cmd.includes('stand') || cmd.includes('stop')) {
          stand();
        } else if (cmd.includes('start') || cmd.includes('deal') || cmd.includes('play')) {
          startNewGame();
        }
        toggleListening(false);
      };

      recognition.onerror = () => toggleListening(false);
      recognition.onend = () => toggleListening(false);
    }

    function toggleListening(forceState) {
      if (!recognition) {
        return;
      }
      isListening = forceState !== undefined ? forceState : !isListening;
      const btn = document.getElementById('mic-btn');
      if (isListening) {
        btn.classList.add('listening');
        recognition.start();
      } else {
        btn.classList.remove('listening');
        try { recognition.stop(); } catch(e){}
      }
    }

    function toggleMute() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('mute-icon').textContent = voiceEnabled ? '🔊' : '🔇';
    }

    // Initialize scoreboard view on page load
    window.onload = function() {
      updateScoreboardDisplay();
    };
  </script>
