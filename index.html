<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Luxor Royale - AI Neural Voice Blackjack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --felt-green: #0d4227;
      --felt-dark: #062113;
      --gold-primary: #d4af37;
      --gold-light: #f7e08b;
      --gold-dark: #aa820a;
      --wood-border: #2c1609;
      --wood-dark: #190a03;
      --card-radius: 10px;
      --chip-shadow: inset 0 0 4px rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at center, #1a0f07 0%, #080402 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
    }
    .table-container {
      position: relative;
      width: 100%;
      max-width: 1100px;
      height: 100vh;
      max-height: 850px;
      background: radial-gradient(ellipse at center, var(--felt-green) 0%, var(--felt-dark) 85%);
      border: 14px solid var(--wood-border);
      outline: 4px solid var(--wood-dark);
      border-radius: 40px;
      box-shadow: inset 0 0 80px rgba(0,0,0,0.8), 0 20px 50px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      margin: auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(212, 175, 55, 0.2);
      padding-bottom: 10px;
    }
    .brand {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold-primary);
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .controls-top { display: flex; gap: 10px; }
    .btn-icon {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-icon:hover { background: var(--gold-primary); color: #000; }
    .table-arc {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 35%;
      border: 2px dashed rgba(212, 175, 55, 0.25);
      border-radius: 50% / 100% 100% 0 0;
      border-bottom: none;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .table-rules {
      font-family: 'Cinzel', serif;
      text-align: center;
      color: rgba(212, 175, 55, 0.4);
      font-size: 0.85rem;
      letter-spacing: 2px;
      line-height: 1.5;
    }
    .play-area {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
      padding: 15px 0;
      position: relative;
      z-index: 2;
    }
    .hand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 160px;
    }
    .hand-label {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      color: var(--gold-light);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .score-badge {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--gold-primary);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
      color: #fff;
    }
    .cards-row {
      display: flex;
      justify-content: center;
      gap: -20px;
      min-height: 120px;
    }
    .card {
      width: 85px;
      height: 120px;
      background: #fff;
      border-radius: var(--card-radius);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
      font-weight: bold;
      margin: 0 -12px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: dealCard 0.4s ease-out forwards;
    }
    @keyframes dealCard {
      from { transform: translateY(-100px) rotate(-10deg) scale(0.5); opacity: 0; }
      to { transform: translateY(0) rotate(0) scale(1); opacity: 1; }
    }
    .card.red { color: #d32f2f; }
    .card.black { color: #212121; }
    .card-corner { font-size: 1.1rem; line-height: 1; text-align: center; }
    .card-suit-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.2rem; }
    .card-back {
      background: linear-gradient(135deg, #b71c1c 0%, #7f0000 100%);
      border: 3px solid #fff;
      border-radius: var(--card-radius);
    }
    .card-back::after {
      content: '♠♥♦♣';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.2);
      font-size: 1rem;
    }
    .chips-bet-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px 0;
    }
    .bet-pot {
      min-height: 50px;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
    }
    .chip {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.75rem;
      color: #fff;
      box-shadow: var(--chip-shadow);
      border: 4px dashed rgba(255,255,255,0.6);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .chip:active { transform: scale(0.9); }
    .chip-5 { background: #d32f2f; }
    .chip-25 { background: #388e3c; }
    .chip-100 { background: #1976d2; }
    .chip-500 { background: #7b1fa2; }
    .status-banner {
      height: 30px;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--gold-light);
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-action {
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-primary) 100%);
      color: #1a0f07;
      border: 1px solid var(--gold-dark);
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }
    .btn-action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(212, 175, 55, 0.4); }
    .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }
    .mic-btn {
      background: #c62828;
      color: #fff;
      border: 2px solid #ff5252;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 82, 82, 0.5);
    }
    .mic-btn.listening { animation: pulse 1.2s infinite; background: #2e7d32; border-color: #66bb6a; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: #190a03;
      border: 2px solid var(--gold-primary);
      width: 90%;
      max-width: 500px;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      color: #fff;
    }
    .modal-header { font-family: 'Cinzel', serif; font-size: 1.3rem; color: var(--gold-light); margin-bottom: 15px; }
    .setting-group { margin-bottom: 15px; }
    .setting-group label { display: block; font-size: 0.85rem; color: #ccc; margin-bottom: 5px; }
    .setting-group input, .setting-group select {
      width: 100%;
      padding: 10px;
      background: #000;
      border: 1px solid var(--gold-primary);
      border-radius: 8px;
      color: #fff;
    }
    .api-instructions {
      background: rgba(212, 175, 55, 0.1);
      border-left: 3px solid var(--gold-primary);
      padding: 10px;
      font-size: 0.8rem;
      line-height: 1.4;
      margin-bottom: 15px;
    }
    .api-instructions a { color: var(--gold-light); }
  </style>
</head>
<body>

  <div class="table-container">
    <div class="header">
      <div class="brand">♠ LUXOR ROYALE</div>
      <div class="controls-top">
        <div class="btn-icon" id="balanceDisplay">💰 $1,000</div>
        <div class="btn-icon" id="btnSettings">⚙️ Settings</div>
      </div>
    </div>

    <div class="table-arc">
      <div class="table-rules">
        BLACKJACK PAYS 3 TO 2<br/>
        DEALER MUST DRAW TO 16 AND STAND ON ALL 17S
      </div>
    </div>

    <div class="play-area">
      <!-- Dealer -->
      <div class="hand-container">
        <div class="hand-label">DEALER <span class="score-badge" id="dealerScore">0</span></div>
        <div class="cards-row" id="dealerCards"></div>
      </div>

      <!-- Status -->
      <div class="chips-bet-area">
        <div class="status-banner" id="statusText">PLACE YOUR BET</div>
        <div class="bet-pot" id="betPot"></div>
      </div>

      <!-- Player -->
      <div class="hand-container">
        <div class="cards-row" id="playerCards"></div>
        <div class="hand-label" style="margin-top: 10px;">PLAYER <span class="score-badge" id="playerScore">0</span></div>
      </div>
    </div>

    <!-- Chips Selection -->
    <div class="chips-bet-area" id="chipSelector" style="flex-direction: row; justify-content: center; gap: 15px; margin-bottom: 10px;">
      <div class="chip chip-5" onclick="addBet(5)">$5</div>
      <div class="chip chip-25" onclick="addBet(25)">$25</div>
      <div class="chip chip-100" onclick="addBet(100)">$100</div>
      <div class="chip chip-500" onclick="addBet(500)">$500</div>
      <div class="btn-icon" onclick="clearBet()">Clear</div>
    </div>

    <!-- Actions -->
    <div class="action-bar">
      <button class="btn-action" id="btnDeal" onclick="dealHand()">DEAL</button>
      <button class="btn-action" id="btnHit" onclick="hit()" disabled>HIT</button>
      <button class="btn-action" id="btnStand" onclick="stand()" disabled>STAND</button>
      <button class="btn-action" id="btnDouble" onclick="doubleDown()" disabled>DOUBLE</button>
      <button class="mic-btn" id="btnMic" onclick="toggleSpeechRecognition()" title="Voice Command">🎙️</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">Dealer Audio & Settings</div>
      
      <div class="api-instructions">
        <strong>Free Gemini API Key Setup:</strong><br/>
        To enable natural dealer voices on GitHub Pages, enter a key from <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a> below.
      </div>

      <div class="setting-group">
        <label>Google Gemini API Key</label>
        <input type="password" id="apiKeyInput" placeholder="Paste AI Studio Key here..." />
      </div>

      <div class="setting-group">
        <label>Dealer Voice Persona</label>
        <select id="voicePersonaSelect">
          <option value="Zephyr">Zephyr (Classic Natural)</option>
          <option value="Kore">Kore (Luxury / Firm)</option>
          <option value="Puck">Puck (Upbeat Vegas)</option>
          <option value="Fenrir">Fenrir (Excitable)</option>
          <option value="Charon">Charon (Informative)</option>
        </select>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
        <button class="btn-action" style="padding: 8px 16px; font-size: 0.9rem;" onclick="saveSettings()">Save & Close</button>
      </div>
    </div>
  </div>

  <script>
    // System Config & State
    const DEFAULT_GEMINI_KEY = ""; // Paste hardcoded key here if desired
    let apiKey = localStorage.getItem('gemini_api_key') || DEFAULT_GEMINI_KEY;
    
    let deck = [], playerHand = [], dealerHand = [];
    let balance = 1000, currentBet = 0, gameActive = false;
    let recognition = null, isListening = false;

    // Elements
    const dealerCardsEl = document.getElementById('dealerCards');
    const playerCardsEl = document.getElementById('playerCards');
    const dealerScoreEl = document.getElementById('dealerScore');
    const playerScoreEl = document.getElementById('playerScore');
    const statusTextEl = document.getElementById('statusText');
    const betPotEl = document.getElementById('betPot');
    const balanceDisplayEl = document.getElementById('balanceDisplay');
    const btnDeal = document.getElementById('btnDeal');
    const btnHit = document.getElementById('btnHit');
    const btnStand = document.getElementById('btnStand');
    const btnDouble = document.getElementById('btnDouble');
    const btnMic = document.getElementById('btnMic');

    // Init Settings UI
    document.getElementById('btnSettings').onclick = () => document.getElementById('settingsModal').classList.add('active');
    document.getElementById('apiKeyInput').value = apiKey;

    function saveSettings() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('gemini_api_key', apiKey);
      document.getElementById('settingsModal').classList.remove('active');
      speakDealer("Settings saved. Ready to play.");
    }

    // Audio / Speech Engine
    async function speakDealer(text) {
      if (!apiKey) {
        // Fallback Web Speech
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
        return;
      }

      const persona = document.getElementById('voicePersonaSelect').value;
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
      
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }],
            generationConfig: {
              responseMimeType: "audio/L16;rate=24000",
              speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: persona } } }
            }
          })
        });

        const data = await response.json();
        const base64Audio = data.candidates[0].content.parts[0].inlineData.data;
        const pcmData = Uint8Array.from(atob(base64Audio), c => c.charCodeAt(0));
        
        // Convert L16 PCM to Playable Audio Buffer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        const dataView = new DataView(pcmData.buffer);
        const float32Array = new Float32Array(pcmData.length / 2);
        for (let i = 0; i < float32Array.length; i++) {
          float32Array[i] = dataView.getInt16(i * 2, true) / 32768.0;
        }
        
        const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 24000);
        audioBuffer.getChannelData(0).set(float32Array);

### How to Find or Open the Canvas Code Panel

* **On Mobile / Phone:**
  Look for a **tab or toggle icon** at the top or bottom of your screen that says **Canvas**, **Code**, or shows a **`< / >`** icon. Tapping that icon switches your view from the chat thread to the full code view.

* **On Desktop / Computer:**
  The Canvas window normally opens as a **split-screen panel on the right side** of your chat. If it is hidden:
  1. Look at the top-right corner of the chat area for a **`< / >` (View Code)** or **Canvas** toggle button.
  2. Click it to expand the side-by-side code editor and live preview.

### Direct Copy Option

If your browser interface isn't displaying the side panel at all, you don't need to worry—you can simply **copy the code directly from the black code block in my previous message**:

1. Find the large box in the message above that starts with `<!DOCTYPE html>`.
2. Tap or click **Copy code** in the top-right corner of that code box.
3. Paste it into any standard text file editor on your device (like Notes, TextEdit, or Notepad) and save the file as `index.html`.
4. Upload that `index.html` file to GitHub Pages as outlined in the steps above!
